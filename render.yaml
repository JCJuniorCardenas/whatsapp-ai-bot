# Blueprint de Render: crea la base y el servicio web con un solo "New Blueprint".
databases:
  - name: whatsapp-bot-db
    plan: free
    databaseName: whatsapp_bot
    user: whatsapp_bot

services:
  - type: web
    name: whatsapp-ai-bot
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-bot-db
          property: connectionString
      - key: WHATSAPP_API_VERSION
        value: v25.0
      # Secretos: se cargan a mano en el panel de Render, nunca en el repo.
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
